
name: Trigger Jenkins CI Pipeline

# -------------------------------------------------------
# WHEN THIS WORKFLOW RUNS
# -------------------------------------------------------
on:
  push:
    branches:
      - main
      - master

# -------------------------------------------------------
# JOB: Trigger Jenkins build
# -------------------------------------------------------
jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # STEP 1: Show commit info (traceability)
      # -------------------------------------------------------
      - name: Print commit details
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"

      # -------------------------------------------------------
      # STEP 2: Trigger Jenkins job remotely
      # -------------------------------------------------------
      - name: Trigger Jenkins Job
        run: |
          curl -X POST \
            "${{ secrets.JENKINS_URL }}/job/${{ secrets.JENKINS_JOB }}/build?token=github-trigger-token" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}"
