# ----------------------------------
# Workflow name
# This is the name displayed in GitHub Actions UI
# ----------------------------------
name: Trigger Jenkins CI

# ----------------------------------
# Workflow trigger condition
# This workflow runs automatically
# whenever a commit is pushed to the main branch
# ----------------------------------
on:
  push:
    branches:
      - main

# ----------------------------------
# Jobs section (MANDATORY root key)
# A workflow can contain one or more jobs
# ----------------------------------
jobs:

  # ----------------------------------
  # Job identifier (internal name only)
  # This name is not shown to Jenkins
  # ----------------------------------
  trigger-jenkins:

    # ----------------------------------
    # Runner selection
    # Uses a self-hosted runner
    # Required so Jenkins is reachable on local network
    # ----------------------------------
    runs-on: self-hosted

    # ----------------------------------
    # Steps define what this job actually does
    # Steps execute sequentially
    # ----------------------------------
    steps:

      # -------------------------------
      # Step name
      # Shown clearly in GitHub Actions logs
      # -------------------------------
      - name: Trigger Jenkins build

        # -------------------------------
        # Explicit shell selection
        # REQUIRED for Windows runners
        # Ensures PowerShell syntax works correctly
        # -------------------------------
        shell: powershell

        # -------------------------------
        # Environment variables
        # Values are injected securely from GitHub Secrets
        # Secrets are masked automatically in logs
        # -------------------------------
        env:

          # Jenkins username
          # Should be a service account (recommended)
          JENKINS_USER: ${{ secrets.JENKINS_USER }}

          # Jenkins API token
          # Generated from:
          # Jenkins → User → Configure → API Token
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}

          # Base Jenkins URL
          # Example: http://192.168.29.84:8080
          # IMPORTANT: No trailing slash
          JENKINS_URL: ${{ secrets.JENKINS_URL }}

          # Jenkins job name (NOT a full URL)
          # Example:
          #   Auto-CI-CD-Build
          #   Folder/job/Auto-CI-CD-Build
          JENKINS_JOB: ${{ secrets.JENKINS_JOB }}

        # -------------------------------
        # PowerShell execution block
        # IMPORTANT:
        # - Use curl.exe (NOT curl alias)
        # - Backtick (`) is PowerShell line continuation
        # -------------------------------
        run: |
          # ----------------------------------
          # STEP 1: Fetch Jenkins CSRF crumb
          # Jenkins blocks POST requests without a valid crumb
          # This request authenticates using API token
          # ----------------------------------
          $crumb = curl.exe -s `
            --user "$env:JENKINS_USER:$env:JENKINS_API_TOKEN" `
            "$env:JENKINS_URL/crumbIssuer/api/json" |
            ConvertFrom-Json

          # ----------------------------------
          # STEP 2: Trigger Jenkins job
          # - Uses POST /build endpoint
          # - Passes CSRF crumb as HTTP header
          # - Authenticates using API token
          # - Fails workflow if Jenkins returns error
          # ----------------------------------
          curl.exe -X POST `
            -H "$($crumb.crumbRequestField): $($crumb.crumb)" `
            --user "$env:JENKINS_USER:$env:JENKINS_API_TOKEN" `
            "$env:JENKINS_URL/job/$env:JENKINS_JOB/build" `
            --fail