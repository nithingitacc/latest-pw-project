# ----------------------------------
# Workflow name
# This is the name shown in GitHub Actions UI
# ----------------------------------
name: Trigger Jenkins CI

# ----------------------------------
# Workflow trigger conditions
# This workflow runs automatically
# whenever code is pushed to the main branch
# ----------------------------------
on:
  push:
    branches:
      - main

# ----------------------------------
# Jobs section (MANDATORY root key)
# A workflow can have one or more jobs
# ----------------------------------
jobs:

  # ----------------------------------
  # Job identifier (internal name)
  # Can be anything, used for reference only
  # ----------------------------------
  trigger-jenkins:

    # ----------------------------------
    # Runner selection
    # Uses an organization-approved self-hosted runner
    # (recommended for Jenkins access & network control)
    # ----------------------------------
    runs-on: self-hosted

    # ----------------------------------
    # Steps define what this job actually does
    # Steps run sequentially
    # ----------------------------------
    steps:

      # -------------------------------
      # Step name
      # Shown clearly in GitHub Actions logs
      # -------------------------------
      - name: Trigger Jenkins build

        # -------------------------------
        # Explicit shell selection
        # REQUIRED on Windows runners
        # Ensures PowerShell syntax works correctly
        # -------------------------------
        shell: powershell

        # -------------------------------
        # Environment variables
        # Injected securely from GitHub Secrets
        # Secrets are masked in logs automatically
        # -------------------------------
        env:
          # Jenkins service account username
          # Should be a non-human, least-privilege user
          JENKINS_USER: ${{ secrets.JENKINS_USER }}

          # Jenkins API token
          # Generated from:
          # Jenkins → User → Configure → API Token
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}

          # Base Jenkins URL
          # Example: http://jenkins.company.local:8080
          JENKINS_URL: ${{ secrets.JENKINS_URL }}

          # Jenkins job path
          # Examples:
          #   MyJob
          #   Folder/job/MyJob
          JENKINS_JOB: ${{ secrets.JENKINS_JOB }}

          # Jenkins remote build trigger token
          # Configured in Jenkins Job → Build Triggers
          JENKINS_TRIGGER_TOKEN: ${{ secrets.JENKINS_TRIGGER_TOKEN }}

        # -------------------------------
        # PowerShell execution block
        # curl.exe is REQUIRED (not curl alias)
        # Backtick (`) is PowerShell line continuation
        # -------------------------------
        run: |
          # ----------------------------------
          # STEP 1: Fetch Jenkins CSRF crumb
          # Jenkins blocks POST requests without this
          # This call authenticates using API token
          # ----------------------------------
          $crumbResponse = curl.exe -s `
            --user "$env:JENKINS_USER:$env:JENKINS_API_TOKEN" `
            "$env:JENKINS_URL/crumbIssuer/api/json"

          # ----------------------------------
          # STEP 2: Convert JSON response to object
          # Extracts crumb field name and value
          # ----------------------------------
          $crumb = ($crumbResponse | ConvertFrom-Json)

          # ----------------------------------
          # STEP 3: Trigger Jenkins job securely
          # - Uses POST /build endpoint
          # - Passes CSRF crumb as HTTP header
          # - Authenticates using API token
          # - Fails fast on HTTP/network errors
          # ----------------------------------
          curl.exe -X POST `
            -H "$($crumb.crumbRequestField): $($crumb.crumb)" `
            "$env:JENKINS_URL/job/$env:JENKINS_JOB/build" `
            --user "$env:JENKINS_USER:$env:JENKINS_API_TOKEN" `
            --connect-timeout 10 `
            --max-time 20 `
            --fail
