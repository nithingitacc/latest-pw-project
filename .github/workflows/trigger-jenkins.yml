# ------------------------------------------------------------
# GitHub Actions workflow name (visible in GitHub Actions UI)
# ------------------------------------------------------------
name: Trigger Jenkins Build

# ------------------------------------------------------------
# When this workflow should run
# Here: on every push to the "main" branch
# ------------------------------------------------------------
on:
  push:
    branches:
      - main

# ------------------------------------------------------------
# Jobs section: defines what actions will be executed
# ------------------------------------------------------------
jobs:
  trigger-jenkins:
    # --------------------------------------------------------
    # Runner type: GitHub-hosted Ubuntu machine
    # --------------------------------------------------------
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # Step 1: Optional but useful
      # Checks out the repository code
      # (not strictly required for triggering Jenkins,
      #  but good practice for CI workflows)
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Step 2: Trigger Jenkins job securely using API token
      # ------------------------------------------------------
      - name: Trigger Jenkins Job
        env:
          # Jenkins base URL (no trailing slash)
          JENKINS_URL: ${{ secrets.JENKINS_URL }}

          # Jenkins username (admin in your case)
          JENKINS_USER: ${{ secrets.JENKINS_USER }}

          # Jenkins API Token stored securely in GitHub Secrets
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_TRIGGER_TOKEN }}

          # Jenkins job name (exactly as it appears in Jenkins UI)
          JENKINS_JOB: ${{ secrets.JENKINS_JOB }}

        run: |
          # --------------------------------------------------
          # Print info (for debugging visibility in logs)
          # --------------------------------------------------
          echo "Triggering Jenkins job: $JENKINS_JOB"
          echo "Jenkins URL: $JENKINS_URL"

          # --------------------------------------------------
          # Step A: Fetch CSRF crumb from Jenkins
          # Jenkins requires this when CSRF protection is ON
          # --------------------------------------------------
          CRUMB_JSON=$(curl -s -u "$JENKINS_USER:$JENKINS_API_TOKEN" \
            "$JENKINS_URL/crumbIssuer/api/json")

          # --------------------------------------------------
          # Extract crumb field name (usually 'Jenkins-Crumb')
          # --------------------------------------------------
          CRUMB_FIELD=$(echo "$CRUMB_JSON" | jq -r '.crumbRequestField')

          # --------------------------------------------------
          # Extract crumb value (random hash generated by Jenkins)
          # --------------------------------------------------
          CRUMB_VALUE=$(echo "$CRUMB_JSON" | jq -r '.crumb')

          # --------------------------------------------------
          # Step B: Trigger the Jenkins job using POST method
          # --------------------------------------------------
          curl -X POST \
            -u "$JENKINS_USER:$JENKINS_API_TOKEN" \
            -H "$CRUMB_FIELD: $CRUMB_VALUE" \
            "$JENKINS_URL/job/$JENKINS_JOB/build"

          # --------------------------------------------------
          # If curl succeeds, Jenkins build is queued instantly
          # --------------------------------------------------
          echo "Jenkins build trigger request sent successfully."
