# ----------------------------------
# Workflow name (shown in GitHub UI)
# ----------------------------------
name: Trigger Jenkins CI

# ----------------------------------
# When this workflow runs
# Triggered on push to main branch
# ----------------------------------
on:
  push:
    branches:
      - main

# ----------------------------------
# Jobs section (REQUIRED root key)
# ----------------------------------
jobs:

  # ----------------------------------
  # Job ID (can be any name)
  # ----------------------------------
  trigger-jenkins:

    # ----------------------------------
    # Runner selection
    # Must match your self-hosted runner
    # ----------------------------------
    runs-on: self-hosted

    # ----------------------------------
    # Steps inside this job
    # ----------------------------------
    steps:

      # -------------------------------
      # Step name shown in GitHub UI
      # This step triggers Jenkins
      # -------------------------------
      - name: Trigger Jenkins build

        # Explicitly tell GitHub Actions to use PowerShell
        shell: powershell

        # -------------------------------
        # Environment variables
        # Injected securely from GitHub Secrets
        # -------------------------------
        env:
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_JOB: ${{ secrets.JENKINS_JOB }}
          JENKINS_TRIGGER_TOKEN: ${{ secrets.JENKINS_TRIGGER_TOKEN }}

        # -------------------------------
        # PowerShell script
        # curl.exe is REQUIRED on Windows
        # -------------------------------
        run: |
          curl.exe -X POST `
            "$env:JENKINS_URL/job/$env:JENKINS_JOB/build?token=$env:JENKINS_TRIGGER_TOKEN" `
            --user "$env:JENKINS_USER:$env:JENKINS_API_TOKEN" `
            --connect-timeout 10 `
            --max-time 20 `
            --fail
